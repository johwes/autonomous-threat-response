# Secret template — DO NOT commit real values.
# SSH key is sourced from the existing 'ssh-key' secret in the namespace.
# Populate with:
#   oc create secret generic threat-response-agent-secrets \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=AAP_TOKEN=... \
#     -n rhn-sa-jwesterl-dev
#
# Or use Sealed Secrets / External Secrets Operator for GitOps workflows.
apiVersion: v1
kind: Secret
metadata:
  name: threat-response-agent-secrets
  namespace: rhn-sa-jwesterl-dev
  labels:
    app: threat-response-agent
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"    # MaaS API key
  AAP_TOKEN: "REPLACE_ME"         # AAP MCP token
  LANGCHAIN_API_KEY: "REPLACE_ME" # LangSmith API key (optional — for trace UI)

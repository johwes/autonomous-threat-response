- rule: Copy Fail AF_ALG Socket Created by Unprivileged Process
  desc: >
    Detects creation of a socket by a non-root host process as an early
    indicator of CVE-2026-31431 (Copy Fail). The follow-up splice rule
    (below) confirms exploitation via the algif fd name. This rule fires
    broadly on socket() — tune or disable if too noisy for your environment.
  condition: >
    evt.type = socket and
    not container and
    not user.uid = 0
  output: >
    socket() called by unprivileged host process — possible Copy Fail early indicator
    (user=%user.name uid=%user.uid pid=%proc.pid
     comm=%proc.name parent=%proc.pname cmdline=%proc.cmdline
     container=%container.name)
  priority: WARNING
  enabled: false
  tags: [CVE-2026-31431, copy_fail, lpe, page_cache]

- rule: Copy Fail Splice into AF_ALG Socket
  desc: >
    Detects splice() from an unprivileged host process where the fd name
    contains "algif" — the kernel's name for AF_ALG (crypto API) socket
    file descriptors. This is the core exploitation primitive of CVE-2026-31431.
  condition: >
    evt.type = splice and
    not container and
    not user.uid = 0 and
    fd.name contains "algif"
  output: >
    splice() into AF_ALG socket by unprivileged host process — possible Copy Fail exploit
    (user=%user.name uid=%user.uid pid=%proc.pid
     comm=%proc.name parent=%proc.pname cmdline=%proc.cmdline
     container=%container.name)
  priority: ERROR
  tags: [CVE-2026-31431, copy_fail, lpe, page_cache]

- rule: Root Shell Spawned Directly by User Shell
  desc: >
    Specification violation: RHEL process ancestry invariant.

    In a correctly specified RHEL environment, privilege elevation always
    interposes su or sudo between a user shell and a root shell. A uid=0
    shell whose direct parent is a user-level interactive shell is
    architecturally impossible under the declared specification — it cannot
    occur via any legitimate path.

    This rule enforces that invariant. It fires on Copy Fail (CVE-2026-31431)
    and Fragnesia (CVE-2026-46300) not because those CVEs are known, but
    because both cause a setuid binary corrupted in the page cache to
    execve()-replace itself with a shell, making a user shell the direct
    parent of a root shell. The specification was violated. The attack is
    detectable regardless of novelty.

    Note: file integrity monitoring and rpm -V are structurally blind to
    both CVEs. The attack corrupts /usr/bin/su in the kernel page cache
    (in-memory) without touching the on-disk file. Only the behavioral
    specification produces a signal.
  condition: >
    spawned_process and
    not container and
    user.uid = 0 and
    proc.name in (bash, sh, dash, zsh, ksh, ksh93, tcsh, csh, fish, rbash, rzsh) and
    proc.pname in (bash, sh, dash, zsh, ksh, ksh93, tcsh, csh, fish, rbash, rzsh)
  output: >
    Root shell spawned directly by user shell — RHEL process ancestry invariant violated
    (user=%user.name uid=%user.uid pid=%proc.pid ppid=%proc.ppid
     comm=%proc.name parent=%proc.pname cmdline=%proc.cmdline
     pcmdline=%proc.pcmdline container=%container.name)
  priority: CRITICAL
  tags: [CVE-2026-31431, CVE-2026-46300, copy_fail, fragnesia, lpe, page_cache, spec_deviation, rhel_invariant]

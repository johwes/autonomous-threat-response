- rule: Copy Fail AF_ALG Socket Created by Unprivileged Process
  desc: >
    Detects creation of an AF_ALG (kernel crypto API) socket by a non-root
    process on the host. CVE-2026-31431 (Copy Fail) requires opening an AF_ALG
    socket as the first step before using splice() to corrupt the page cache.
  condition: >
    evt.type = socket and
    fd.family = AF_ALG and
    not container and
    not user.uid = 0
  output: >
    AF_ALG socket opened by unprivileged host process
    (user=%user.name uid=%user.uid pid=%proc.pid
     comm=%proc.name parent=%proc.pname cmdline=%proc.cmdline
     container=%container.name)
  priority: WARNING
  tags: [CVE-2026-31431, copy_fail, lpe, page_cache]

- rule: Copy Fail Splice into AF_ALG Socket
  desc: >
    Detects splice() syscall from an unprivileged host process where the fd name
    suggests an algif (ALG interface) socket — the kernel's name for AF_ALG
    file descriptors. Combined with AF_ALG socket creation, this is the core
    exploitation primitive of CVE-2026-31431.
  condition: >
    evt.type = splice and
    not container and
    not user.uid = 0 and
    fd.name contains "algif"
  output: >
    splice() into AF_ALG socket by unprivileged host process — possible Copy Fail exploit
    (user=%user.name uid=%user.uid pid=%proc.pid
     comm=%proc.name parent=%proc.pname cmdline=%proc.cmdline
     container=%container.name)
  priority: ERROR
  tags: [CVE-2026-31431, copy_fail, lpe, page_cache]

- rule: Setuid Binary Spawns Unexpected Root Shell
  desc: >
    Detects a setuid binary (e.g. /usr/bin/su) spawning a shell as root on the
    host. This is the post-exploitation indicator for both Copy Fail
    (CVE-2026-31431) and Fragnesia (CVE-2026-46300) — the corrupted in-memory
    setuid binary executes attacker-controlled code.
  condition: >
    spawned_process and
    not container and
    proc.pname in (su, newgrp, passwd, mount, umount) and
    user.uid = 0 and
    proc.name in (bash, sh, dash, zsh, ksh, ksh93, tcsh, csh, fish, rbash, rzsh)
  output: >
    Setuid binary spawned root shell — possible LPE via page cache corruption
    (user=%user.name uid=%user.uid pid=%proc.pid
     comm=%proc.name parent=%proc.pname cmdline=%proc.cmdline
     pcmdline=%proc.pcmdline container=%container.name)
  priority: CRITICAL
  tags: [CVE-2026-31431, CVE-2026-46300, copy_fail, fragnesia, lpe, page_cache]

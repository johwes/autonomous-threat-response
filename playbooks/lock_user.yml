---
# Record a security incident audit entry for a user involved in an LPE event.
# For demo purposes this writes an audit log rather than locking the account,
# so the demo environment remains accessible after remediation.
#
# Extra vars expected:
#   compromised_user: username of the account involved
#   target_host:      RHEL host to remediate

- name: Record security incident audit entry for user
  hosts: "{{ target_host }}"
  become: true
  gather_facts: true

  tasks:
    - name: Ensure audit directory exists
      ansible.builtin.file:
        path: /var/log/security-incidents
        state: directory
        mode: '0750'
        owner: root
        group: root

    - name: Capture current user info
      ansible.builtin.command:
        cmd: id {{ compromised_user }}
      register: user_info
      changed_when: false

    - name: Write incident audit entry
      ansible.builtin.copy:
        dest: "/var/log/security-incidents/{{ compromised_user }}-{{ ansible_date_time.iso8601_basic_short }}.txt"
        content: |
          SECURITY INCIDENT AUDIT RECORD
          ================================
          Timestamp  : {{ ansible_date_time.iso8601 }}
          Host       : {{ target_host }}
          User       : {{ compromised_user }}
          User info  : {{ user_info.stdout }}
          Reason     : User session involved in confirmed security incident
          Rule       : Root Shell Spawned Directly by User Shell
          CVE        : CVE-2026-31431 (Copy Fail — page cache corruption LPE)
          Action     : Incident logged. Manual account review required.
          Status     : PENDING REVIEW
        mode: '0640'
        owner: root
        group: root

    - name: Report audit entry written
      ansible.builtin.debug:
        msg: "Incident audit record written for user={{ compromised_user }} on host={{ target_host }}"

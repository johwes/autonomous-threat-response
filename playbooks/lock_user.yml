---
# Lock a compromised user account pending investigation.
# Prevents re-authentication while preserving the account and home directory
# for forensic analysis.
#
# Extra vars expected:
#   compromised_user: username of the account to lock
#   target_host:      RHEL host to remediate

- name: Lock compromised user account
  hosts: "{{ target_host }}"
  become: true
  gather_facts: false

  tasks:
    - name: Capture current user info (for audit trail)
      ansible.builtin.command:
        cmd: id {{ compromised_user }}
      register: user_info
      changed_when: false

    - name: Log user info before lock
      ansible.builtin.debug:
        msg: "Locking account: {{ user_info.stdout }}"

    - name: Lock the user account (disables password auth)
      ansible.builtin.user:
        name: "{{ compromised_user }}"
        password_lock: true

    - name: Expire the account immediately (disables all auth)
      ansible.builtin.command:
        cmd: chage -E 0 {{ compromised_user }}
      changed_when: true

    - name: Kill all active sessions for the user
      ansible.builtin.command:
        cmd: pkill -KILL -u {{ compromised_user }}
      ignore_errors: true
      changed_when: true

    - name: Remove any authorized_keys to block SSH key auth
      ansible.builtin.file:
        path: "/home/{{ compromised_user }}/.ssh/authorized_keys"
        state: absent

    - name: Confirm account is locked
      ansible.builtin.command:
        cmd: passwd -S {{ compromised_user }}
      register: passwd_status
      changed_when: false

    - name: Report lock status
      ansible.builtin.debug:
        msg: "Account status: {{ passwd_status.stdout }}"
